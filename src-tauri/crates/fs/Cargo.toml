[package]
name = "spec-board-fs"
version = "0.1.0"
edition = "2021"
description = "spec-board のファイルシステム I/O（再帰スキャン等）を集約するサブクレート"
publish = false

[dependencies]
walkdir = "2"
thiserror = "2"
notify = "8"

[dev-dependencies]
tempfile = "3"

[features]
# テスト専用 API（mutex poison ヘルパ等）。本番 build では無効。
# spec-board 側の `[dev-dependencies]` で `features = ["test-utils"]` を有効化する。
test-utils = []
