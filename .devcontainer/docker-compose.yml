services:
  app:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: spec-board
    tmpfs:
      - /var/tmp/codex-sqlite:size=1g
    environment:
      CODEX_SQLITE_HOME: /var/tmp/codex-sqlite
    volumes:
      - ..:/workspace:cached
    ports:
      - "4000:4000"
      - "4001:4001"
    command: sleep infinity
