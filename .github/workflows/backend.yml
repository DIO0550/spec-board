name: backend

on:
  pull_request:

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default stable

      - name: Cache Rust build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        run: |
          # cache hit 時は ~/.cargo/bin に既にバイナリがあるため再インストールしない
          # （tracking 情報なしの再 install は untracked 衝突でエラーになる）。
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi

      - name: Generate coverage
        if: always()
        run: |
          cargo llvm-cov --workspace --text --output-path coverage.txt
          SUMMARY_JSON=$(cargo llvm-cov --workspace --json --summary-only)
          status_for() {
            local pct=$1
            if awk "BEGIN{exit !(${pct} >= 80)}"; then echo '🟢'
            elif awk "BEGIN{exit !(${pct} >= 50)}"; then echo '🟡'
            else echo '🔴'
            fi
          }
          LINES=$(printf '%.2f' "$(echo "$SUMMARY_JSON" | jq -r '.data[0].totals.lines.percent // 0')")
          FUNCTIONS=$(printf '%.2f' "$(echo "$SUMMARY_JSON" | jq -r '.data[0].totals.functions.percent // 0')")
          REGIONS=$(printf '%.2f' "$(echo "$SUMMARY_JSON" | jq -r '.data[0].totals.regions.percent // 0')")
          S_LINES=$(status_for "$LINES")
          S_FUNCS=$(status_for "$FUNCTIONS")
          S_REGNS=$(status_for "$REGIONS")
          {
            echo '## Backend Coverage (cargo-llvm-cov)'
            echo
            echo "Commit: \`${GITHUB_SHA:0:7}\` — 凡例: 🟢 ≥80 / 🟡 50-79 / 🔴 <50"
            echo
            echo '| Status | Metric | Percentage |'
            echo '| :---: | --- | ---: |'
            echo "| ${S_LINES} | Lines | ${LINES}% |"
            echo "| ${S_FUNCS} | Functions | ${FUNCTIONS}% |"
            echo "| ${S_REGNS} | Regions | ${REGIONS}% |"
            echo
            echo '<details><summary>Per-line coverage</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo '</details>'
          } > "$GITHUB_WORKSPACE/coverage.md"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.md
          if-no-files-found: ignore
          retention-days: 1

  coverage-comment:
    name: post coverage comment
    needs: check
    if: always() && needs.check.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: .

      - name: Post coverage comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f coverage.md ]; then
            echo "coverage.md not found; skipping"
            exit 0
          fi
          MARKER="<!-- sticky-comment: backend-coverage -->"
          BODY=$(printf '%s\n%s' "$MARKER" "$(cat coverage.md)")
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -f body="$BODY"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY"
          fi
